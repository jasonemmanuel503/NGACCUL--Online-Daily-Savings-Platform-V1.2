<!doctype html>
<html lang="en">
  <head>
    <!-- Prevent sandboxed iframe environments or third-party extensions from crashing on read-only window.fetch -->
    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; }
          });
        } catch (e) {
          console.warn('[FetchPatch] Failed to patch window.fetch:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />

    <!-- Preconnecting to Google Fonts -->

</html>
